# Server stack for the VPS. TLS comes from the box's shared Caddy (/srv/caddy),
# which proxies the public hostname -> aladi:8377 over the external "web"
# network; login is handled in-app (server.py). Nothing here publishes a port.
# Run from /srv/aladi on the box:
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml run --rm jobs      # weekly (cron, all langs)
#   docker compose -f deploy/compose.yaml run --rm -e ALADI_LANGS=ita jobs
# Pin the project name: compose otherwise names it after the directory ("deploy"),
# which collides with the ledger stack on the same box.
name: aladi

services:
  web:
    image: aladi
    build:
      context: ..
    restart: unless-stopped
    init: true
    # ALADI_USERS / ALADI_SECRET live in /srv/aladi/.env on the box (chmod 600,
    # never in git). Optional so the same file also works without one.
    env_file:
      - path: ../.env
        required: false
    # Fail closed: without a parsable ALADI_USERS the container exits instead of
    # serving the catalogue to the world. Caddy is the only client, so its
    # X-Forwarded-For is trusted for the login lockout.
    environment:
      ALADI_REQUIRE_AUTH: "1"
      ALADI_TRUST_PROXY: "1"
    volumes:
      - ../data:/app/data
    networks:
      default: {}
      web:
        aliases: [aladi]

  jobs:
    image: aladi
    profiles: ["jobs"]
    init: true
    # Which catalogues the weekly pass covers; override per-run with
    # `run --rm -e ALADI_LANGS=ita jobs`.
    environment:
      ALADI_LANGS: "${ALADI_LANGS:-eng ita}"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    command: ["./run_weekly.sh"]

networks:
  web:
    external: true
